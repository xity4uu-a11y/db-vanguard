<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="db-vanguard — Native Pure-Rust Database GUI and Streaming SQL Exporter">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e6e8ec" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Crisp Apple-inspired light surface -->
  <rect width="1200" height="340" fill="#f7f7f8"/>
  <rect width="1200" height="340" fill="url(#grid)" opacity="0.65"/>

  <!-- Centered precision card -->
  <rect x="44" y="34" width="1112" height="272" rx="16" fill="#ffffff" stroke="#dfe2e7" stroke-width="1.5"/>

  <!-- Geometric monochrome database mark -->
  <g transform="translate(88, 92)">
    <rect x="0" y="0" width="84" height="84" rx="18" fill="#141518"/>
    <ellipse cx="42" cy="27" rx="20" ry="7" fill="none" stroke="#ffffff" stroke-width="2.8"/>
    <path d="M22 27v16c0 3.9 9 7 20 7s20-3.1 20-7V27" fill="none" stroke="#ffffff" stroke-width="2.8"/>
    <path d="M22 43v16c0 3.9 9 7 20 7s20-3.1 20-7V43" fill="none" stroke="#a1a7b3" stroke-width="2.8"/>
  </g>

  <!-- Title & Positioning -->
  <text x="198" y="124" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="40" font-weight="700" letter-spacing="-0.03em" fill="#141518">db-vanguard</text>
  <rect x="454" y="99" width="70" height="26" rx="13" fill="#f1f2f4" stroke="#d4d8e0" stroke-width="1"/>
  <text x="489" y="116" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="12" font-weight="600" fill="#525763">v1.0.0</text>

  <text x="198" y="160" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="19" font-weight="500" fill="#434854">Stop paying $200/yr for a database GUI that crashes on large exports.</text>
  <text x="198" y="188" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#6b7280">Pure-Rust PostgreSQL v3 Wire Client  |  SQLite 3 Binary Inspector  |  Tauri v2 Native Shell  |  O(1) Streaming Exports</text>

  <!-- Hairline divider -->
  <line x1="88" y1="216" x2="1112" y2="216" stroke="#e6e8ec" stroke-width="1"/>

  <!-- 4 Restrained Metric Cards -->
  <g transform="translate(88, 234)">
    <rect x="0" y="0" width="236" height="50" rx="8" fill="#f7f8fa" stroke="#e2e4e8" stroke-width="1"/>
    <text x="14" y="21" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#7c8290">MEMORY FOOTPRINT</text>
    <text x="14" y="40" font-family="JetBrains Mono, monospace" font-size="15" font-weight="700" fill="#141518">18 MB</text>
    <text x="72" y="40" font-family="Inter, sans-serif" font-size="12" fill="#1d6b3c">vs 650 MB Electron</text>
  </g>

  <g transform="translate(350, 234)">
    <rect x="0" y="0" width="236" height="50" rx="8" fill="#f7f8fa" stroke="#e2e4e8" stroke-width="1"/>
    <text x="14" y="21" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#7c8290">50,000-ROW CSV STREAM</text>
    <text x="14" y="40" font-family="JetBrains Mono, monospace" font-size="15" font-weight="700" fill="#141518">42 ms</text>
    <text x="72" y="40" font-family="Inter, sans-serif" font-size="12" fill="#525763">64 KiB BufWriter</text>
  </g>

  <g transform="translate(612, 234)">
    <rect x="0" y="0" width="236" height="50" rx="8" fill="#f7f8fa" stroke="#e2e4e8" stroke-width="1"/>
    <text x="14" y="21" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#7c8290">SAFETY LINTER</text>
    <text x="14" y="40" font-family="JetBrains Mono, monospace" font-size="15" font-weight="700" fill="#141518">7 Rules</text>
    <text x="84" y="40" font-family="Inter, sans-serif" font-size="12" fill="#525763">Zero-dep SQL AST</text>
  </g>

  <g transform="translate(874, 234)">
    <rect x="0" y="0" width="238" height="50" rx="8" fill="#f7f8fa" stroke="#e2e4e8" stroke-width="1"/>
    <text x="14" y="21" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#7c8290">ANNUAL LICENSE</text>
    <text x="14" y="40" font-family="JetBrains Mono, monospace" font-size="15" font-weight="700" fill="#1d6b3c">$0 / yr</text>
    <text x="86" y="40" font-family="Inter, sans-serif" font-size="12" fill="#525763">MIT Open Source</text>
  </g>
</svg>
