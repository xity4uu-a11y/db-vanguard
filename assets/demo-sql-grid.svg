<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 580" width="1080" height="580" role="img" aria-label="db-vanguard 15-second animated demo showing 0.8ms SQL execution and 50,000-row streaming CSV export in 42ms using 18 MB RAM">
  <style>
    .sans { font-family: Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif; }
    .mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Consolas, monospace; }

    /* 15s looping timeline:
       0%-20%: Highlighted query + Safety Linter PASS
       20%-45%: Query executes in 0.8ms, grid populates cleanly
       45%-85%: Constant-memory 50,000-row CSV streaming export overlay runs in 42ms
       85%-100%: Comparison summary (18 MB vs 650 MB Electron, $0/yr) then clean loop
    */
    @keyframes cursorBlink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes runPulse {
      0%, 16% { fill: #141518; }
      18%, 24% { fill: #1d6b3c; }
      28%, 100% { fill: #141518; }
    }
    @keyframes gridReveal {
      0%, 18% { opacity: 0.25; }
      24%, 95% { opacity: 1; }
      100% { opacity: 0.25; }
    }
    @keyframes exportOverlay {
      0%, 42% { opacity: 0; transform: translateY(8px); }
      47%, 94% { opacity: 1; transform: translateY(0px); }
      98%, 100% { opacity: 0; transform: translateY(8px); }
    }
    @keyframes streamBar {
      0%, 46% { width: 0px; }
      68%, 95% { width: 392px; }
      100% { width: 0px; }
    }
    @keyframes doneBadge {
      0%, 66% { opacity: 0; }
      70%, 95% { opacity: 1; }
      100% { opacity: 0; }
    }

    .blink { animation: cursorBlink 1s infinite; }
    .run-btn { animation: runPulse 15s infinite; }
    .grid-rows { animation: gridReveal 15s infinite; }
    .export-card { animation: exportOverlay 15s infinite; }
    .stream-fill { animation: streamBar 15s ease-out infinite; }
    .done-pill { animation: doneBadge 15s infinite; }
  </style>

  <!-- Outer studio canvas -->
  <rect width="1080" height="580" rx="14" fill="#f7f7f8" stroke="#d8dce3" stroke-width="1.5"/>

  <!-- Native Titlebar -->
  <rect x="0" y="0" width="1080" height="44" rx="14" fill="#ffffff"/>
  <rect x="0" y="28" width="1080" height="16" fill="#ffffff"/>
  <line x1="0" y1="44" x2="1080" y2="44" stroke="#e2e4e8" stroke-width="1"/>

  <!-- Window dots (restrained neutral) -->
  <circle cx="22" cy="22" r="5" fill="#d4d8e0"/>
  <circle cx="38" cy="22" r="5" fill="#d4d8e0"/>
  <circle cx="54" cy="22" r="5" fill="#d4d8e0"/>

  <!-- Brand -->
  <rect x="74" y="11" width="22" height="22" rx="5" fill="#141518"/>
  <text x="85" y="26" text-anchor="middle" class="mono" font-size="10" font-weight="700" fill="#ffffff">DV</text>
  <text x="104" y="26" class="sans" font-size="13" font-weight="600" fill="#141518">db-vanguard</text>
  <text x="192" y="26" class="sans" font-size="12" fill="#7c8290">| Native SQL Studio (Tauri v2 + Rust)</text>

  <!-- Right Telemetry Pills -->
  <rect x="652" y="10" width="146" height="24" rx="12" fill="#eef7f1" stroke="#c5e6d1" stroke-width="1"/>
  <circle cx="666" cy="22" r="3.5" fill="#1d6b3c"/>
  <text x="676" y="26" class="mono" font-size="11" font-weight="600" fill="#1d6b3c">RAM: 18 MB</text>

  <rect x="808" y="10" width="142" height="24" rx="12" fill="#f1f2f4" stroke="#e2e4e8" stroke-width="1"/>
  <text x="879" y="26" text-anchor="middle" class="mono" font-size="11" fill="#525763">Electron: 650 MB</text>

  <rect x="960" y="10" width="104" height="24" rx="12" fill="#141518"/>
  <text x="1012" y="26" text-anchor="middle" class="mono" font-size="11" font-weight="600" fill="#ffffff">$0/yr MIT</text>

  <!-- Left Sidebar (x=0..236) -->
  <rect x="0" y="45" width="236" height="535" fill="#ffffff"/>
  <line x1="236" y1="45" x2="236" y2="580" stroke="#e2e4e8" stroke-width="1"/>

  <text x="16" y="70" class="sans" font-size="10" font-weight="700" fill="#7c8290" letter-spacing="0.06em">CONNECTIONS</text>
  <rect x="12" y="78" width="212" height="34" rx="6" fill="#f1f2f4" stroke="#cdd1d8" stroke-width="1"/>
  <text x="22" y="94" class="sans" font-size="12" font-weight="600" fill="#141518">Local Demo</text>
  <text x="22" y="106" class="mono" font-size="10" fill="#7c8290">vanguard_ecommerce_demo</text>
  <rect x="188" y="87" width="28" height="16" rx="4" fill="#ffffff" stroke="#d8dce3" stroke-width="1"/>
  <text x="202" y="99" text-anchor="middle" class="mono" font-size="9" font-weight="600" fill="#525763">RW</text>

  <text x="22" y="130" class="sans" font-size="12" fill="#525763">PostgreSQL (Wire v3)</text>
  <text x="22" y="150" class="sans" font-size="12" fill="#525763">SQLite 3 (WAL Native)</text>
  <text x="22" y="170" class="sans" font-size="12" fill="#525763">MySQL 8 Protocol</text>

  <line x1="12" y1="186" x2="224" y2="186" stroke="#e2e4e8" stroke-width="1"/>
  <text x="16" y="206" class="sans" font-size="10" font-weight="700" fill="#7c8290" letter-spacing="0.06em">SCHEMA (4 TABLES)</text>

  <text x="22" y="228" class="mono" font-size="12" font-weight="600" fill="#141518">v orders</text>
  <text x="218" y="228" text-anchor="end" class="mono" font-size="11" fill="#7c8290">240</text>
  <line x1="28" y1="236" x2="28" y2="306" stroke="#e2e4e8" stroke-width="1"/>
  <text x="38" y="248" class="mono" font-size="11" fill="#525763">id [PK]</text>
  <text x="218" y="248" text-anchor="end" class="mono" font-size="10" fill="#7c8290">INTEGER</text>
  <text x="38" y="266" class="mono" font-size="11" fill="#525763">user_id</text>
  <text x="218" y="266" text-anchor="end" class="mono" font-size="10" fill="#7c8290">INTEGER</text>
  <text x="38" y="284" class="mono" font-size="11" fill="#525763">total_cents</text>
  <text x="218" y="284" text-anchor="end" class="mono" font-size="10" fill="#7c8290">INTEGER</text>
  <text x="38" y="302" class="mono" font-size="11" fill="#525763">status</text>
  <text x="218" y="302" text-anchor="end" class="mono" font-size="10" fill="#7c8290">TEXT</text>

  <text x="22" y="328" class="mono" font-size="12" fill="#525763">&gt; users</text>
  <text x="218" y="328" text-anchor="end" class="mono" font-size="11" fill="#7c8290">120</text>
  <text x="22" y="350" class="mono" font-size="12" fill="#525763">&gt; products</text>
  <text x="218" y="350" text-anchor="end" class="mono" font-size="11" fill="#7c8290">60</text>
  <text x="22" y="372" class="mono" font-size="12" fill="#525763">&gt; invoices</text>
  <text x="218" y="372" text-anchor="end" class="mono" font-size="11" fill="#7c8290">160</text>

  <!-- Right Top: SQL Editor (x=237..1080, y=45..266) -->
  <rect x="237" y="45" width="843" height="36" fill="#ffffff"/>
  <line x1="237" y1="81" x2="1080" y2="81" stroke="#e2e4e8" stroke-width="1"/>

  <rect x="250" y="51" width="112" height="24" rx="5" class="run-btn"/>
  <text x="306" y="67" text-anchor="middle" class="sans" font-size="11.5" font-weight="600" fill="#ffffff">Run Query</text>

  <rect x="370" y="51" width="94" height="24" rx="5" fill="#ffffff" stroke="#d8dce3" stroke-width="1"/>
  <text x="417" y="67" text-anchor="middle" class="sans" font-size="11.5" font-weight="500" fill="#141518">Format SQL</text>

  <rect x="472" y="51" width="72" height="24" rx="5" fill="#ffffff" stroke="#d8dce3" stroke-width="1"/>
  <text x="508" y="67" text-anchor="middle" class="sans" font-size="11.5" font-weight="500" fill="#141518">Explain</text>

  <rect x="942" y="51" width="124" height="24" rx="5" fill="#f1f2f4" stroke="#cdd1d8" stroke-width="1"/>
  <text x="1004" y="67" text-anchor="middle" class="sans" font-size="11.5" font-weight="600" fill="#141518">Streaming Export</text>

  <!-- Editor Gutter + Code -->
  <rect x="237" y="82" width="38" height="156" fill="#f1f2f4"/>
  <line x1="275" y1="82" x2="275" y2="238" stroke="#e2e4e8" stroke-width="1"/>
  <rect x="276" y="82" width="804" height="156" fill="#ffffff"/>

  <g class="mono" font-size="11.5" fill="#858b98" text-anchor="end">
    <text x="267" y="102">1</text>
    <text x="267" y="122">2</text>
    <text x="267" y="142">3</text>
    <text x="267" y="162">4</text>
    <text x="267" y="182">5</text>
    <text x="267" y="202">6</text>
    <text x="267" y="222">7</text>
  </g>

  <g class="mono" font-size="12.5">
    <text x="290" y="102"><tspan fill="#1f4c8f" font-weight="600">SELECT</tspan><tspan fill="#141518"> o.id, u.email, o.region, o.total_cents, o.status</tspan></text>
    <text x="290" y="122"><tspan fill="#1f4c8f" font-weight="600">FROM</tspan><tspan fill="#141518"> orders o</tspan></text>
    <text x="290" y="142"><tspan fill="#1f4c8f" font-weight="600">INNER JOIN</tspan><tspan fill="#141518"> users u </tspan><tspan fill="#1f4c8f" font-weight="600">ON</tspan><tspan fill="#141518"> o.user_id = u.id</tspan></text>
    <text x="290" y="162"><tspan fill="#1f4c8f" font-weight="600">WHERE</tspan><tspan fill="#141518"> o.status = </tspan><tspan fill="#2c6e49">'paid'</tspan></text>
    <text x="290" y="182"><tspan fill="#1f4c8f" font-weight="600">ORDER BY</tspan><tspan fill="#141518"> o.total_cents </tspan><tspan fill="#1f4c8f" font-weight="600">DESC</tspan></text>
    <text x="290" y="202"><tspan fill="#1f4c8f" font-weight="600">LIMIT</tspan><tspan fill="#7c4d12"> 50</tspan><tspan fill="#141518">;</tspan></text>
    <text x="290" y="222" fill="#858b98" font-style="italic">-- Zero-dep SQL lexer + safety linter active</text>
    <rect x="356" y="191" width="1.8" height="14" fill="#141518" class="blink"/>
  </g>

  <!-- Safety Linter Bar -->
  <rect x="237" y="238" width="843" height="28" fill="#eef7f1"/>
  <line x1="237" y1="238" x2="1080" y2="238" stroke="#c5e6d1" stroke-width="1"/>
  <line x1="237" y1="266" x2="1080" y2="266" stroke="#e2e4e8" stroke-width="1"/>
  <text x="252" y="256" class="sans" font-size="11.5" font-weight="600" fill="#1d6b3c">Safety Linter: PASS  —  0 destructive warnings (VG001..VG007 clear)</text>
  <text x="1064" y="256" text-anchor="end" class="mono" font-size="11" fill="#1d6b3c">38 tokens</text>

  <!-- Result Grid Header Bar -->
  <rect x="237" y="267" width="843" height="34" fill="#ffffff"/>
  <line x1="237" y1="301" x2="1080" y2="301" stroke="#e2e4e8" stroke-width="1"/>
  <text x="252" y="288" class="sans" font-size="12" fill="#525763">Rows: <tspan fill="#141518" font-weight="600" class="mono">50</tspan>   Execution: <tspan fill="#1d6b3c" font-weight="700" class="mono">0.8 ms</tspan>   Tag: <tspan fill="#141518" class="mono">SELECT 50</tspan></text>
  <text x="1064" y="288" text-anchor="end" class="mono" font-size="11" fill="#7c8290">Virtualized Grid | Page 1 / 1</text>

  <!-- Data Grid Columns -->
  <rect x="237" y="302" width="843" height="30" fill="#f1f2f4"/>
  <line x1="237" y1="332" x2="1080" y2="332" stroke="#cdd1d8" stroke-width="1"/>
  <g class="sans" font-size="11.5" font-weight="600" fill="#141518">
    <text x="252" y="321">#</text>
    <text x="292" y="321">id</text>
    <text x="368" y="321">email</text>
    <text x="646" y="321">region</text>
    <text x="802" y="321">total_cents [DESC]</text>
    <text x="974" y="321">status</text>
  </g>

