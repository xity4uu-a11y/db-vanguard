    <text x="26" y="131" class="mono" font-size="15" font-weight="700" fill="#141518">50,000</text>

    <rect x="150" y="90" width="124" height="58" rx="6" fill="#f7f8fa" stroke="#e2e4e8" stroke-width="1"/>
    <text x="160" y="109" class="sans" font-size="10" font-weight="600" fill="#7c8290">ELAPSED TIME</text>
    <text x="160" y="131" class="mono" font-size="15" font-weight="700" fill="#1d6b3c">42 ms</text>

    <rect x="284" y="90" width="140" height="58" rx="6" fill="#f7f8fa" stroke="#e2e4e8" stroke-width="1"/>
    <text x="294" y="109" class="sans" font-size="10" font-weight="600" fill="#7c8290">PEAK RAM / COST</text>
