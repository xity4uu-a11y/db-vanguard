      <rect x="366" y="8" width="60" height="18" rx="9" fill="#eef7f1" stroke="#c5e6d1" stroke-width="1"/>
      <text x="396" y="20" text-anchor="middle" class="mono" font-size="10" font-weight="700" fill="#1d6b3c">DONE</text>
    </g>

    <text x="16" y="56" class="mono" font-size="12" fill="#141518">orders_50k.csv  (OWASP formula guard ON)</text>

