  <!-- Animated Streaming Export Overlay Card (appears at 45% of 15s loop) -->
  <g class="export-card" transform="translate(616, 392)">
    <rect x="0" y="0" width="440" height="166" rx="10" fill="#ffffff" stroke="#141518" stroke-width="1.5"/>
    <rect x="0" y="0" width="440" height="34" rx="10" fill="#f7f8fa"/>
    <rect x="0" y="22" width="440" height="12" fill="#f7f8fa"/>
