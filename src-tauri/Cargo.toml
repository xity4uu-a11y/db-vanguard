[package]
name = "db-vanguard-desktop"
version = "1.0.0"
edition = "2021"
license = "MIT"
authors = ["xity4uu-a11y <255560410+xity4uu-a11y@users.noreply.github.com>"]
description = "Tauri v2 native desktop shell for db-vanguard (zero Electron overhead)."

[lib]
name = "db_vanguard_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
vanguard-core = { path = "../crates/vanguard-core" }
